name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: read
      checks: write
      packages: write
    uses: oxHive/pipelines/.github/workflows/rust-release.yml@v2
    with:
      package-name: oxr
      binary-name: oxr
      publish-homebrew: true
      homebrew-install: bin.install "oxr"
      homebrew-test-command: system "#{bin}/oxr", "--version"
    secrets: inherit
