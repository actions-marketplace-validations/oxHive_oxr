name: Publish

# alpha/beta tags are intentionally not published: the shared pipeline only
# recognizes `-rc` as a pre-release and would push anything else to
# Homebrew/crates as if it were stable.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: read
      checks: write
      packages: write
    # Pinned to a commit: this job inherits every repo secret, so a moved
    # tag must not be able to change the code it runs. Dependabot bumps it.
    uses: oxHive/pipelines/.github/workflows/rust-release.yml@50dc32fcdc6298928492b893b482b40135c1d367 # v2.10.1
    with:
      package-name: oxr
      binary-name: oxr
      publish-homebrew: true
      homebrew-install: bin.install "oxr"
      homebrew-test-command: system "#{bin}/oxr", "--version"
    secrets: inherit
