[package]
name = "oxr"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Semantic-version bump and git-tag orchestrator for manifest-less repos"
license = "MIT"

[[bin]]
name = "oxr"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
regex = "1"
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
