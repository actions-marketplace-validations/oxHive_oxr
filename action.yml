name: 'oxrelease'
description: 'Install the oxr semantic-version bump and git-tag orchestrator onto PATH'
branding:
  icon: 'tag'
  color: 'blue'

runs:
  using: "composite"
  steps:
    - name: Install oxr from GitHub release
      shell: bash
      run: |
        set -euo pipefail

        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *)
            echo "::error::oxr has no prebuilt binary for ${{ runner.os }}-${{ runner.arch }}. Supported platforms: Linux-X64, Linux-ARM64, macOS-ARM64." >&2
            exit 1
            ;;
        esac

        repo="${{ github.action_repository }}"
        ref="${{ github.action_ref }}"
        asset="oxr-${target}.tar.gz"
        url="https://github.com/${repo}/releases/download/${ref}/${asset}"
        dist_dir="${RUNNER_TEMP}/oxr-dist"

        mkdir -p "$dist_dir"
        echo "Downloading $url"
        curl -fsSL "$url" -o "$dist_dir/$asset"
        tar -xzf "$dist_dir/$asset" -C "$dist_dir"
        chmod +x "$dist_dir/oxr"

        echo "$dist_dir" >> "$GITHUB_PATH"
