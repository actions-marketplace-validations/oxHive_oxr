name: 'oxrelease'
description: 'Install the oxr semantic-version bump and git-tag orchestrator onto PATH'
branding:
  icon: 'tag'
  color: 'blue'

inputs:
  version:
    description: >-
      oxr release tag to install, e.g. v0.2.0. Defaults to the version in
      the Cargo.toml at the ref this action is pinned to, so tag, floating
      tag (@v1), and commit-SHA pins all resolve to a published release.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Install oxr from GitHub release
      shell: bash
      # Expressions go through env, never straight into the script.
      env:
        OXR_VERSION_INPUT: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="$OXR_VERSION_INPUT"
        if [ -z "$version" ]; then
          version="v$(sed -n 's/^version = "\(.*\)"$/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -n 1)"
        fi
        if [ "$version" = "v" ]; then
          echo "::error::could not read a version from $GITHUB_ACTION_PATH/Cargo.toml; set the 'version' input" >&2
          exit 1
        fi

        install_dir="${RUNNER_TEMP}/oxr-bin"
        VERSION="$version" INSTALL_DIR="$install_dir" sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$install_dir" >> "$GITHUB_PATH"
